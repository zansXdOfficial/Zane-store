<html lang="id">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZANE STORE ID — AM Premium | Suntik Sosmed | Nokos</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }

  body {
    background: #0d0d16;
    color: #fff;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  /* Proteksi seleksi teks & drag */
  body {
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  img { -webkit-user-drag: none; pointer-events: none; }

  header {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    background: rgba(13,13,22,0.9);
    backdrop-filter: blur(15px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(135deg,#8a2be2,#00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .logo img {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    object-fit: cover;
  }

  .header-right { display: flex; align-items: center; gap: 10px; }

  .cart-icon {
    position: relative;
    width: 44px;
    height: 44px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 20px;
    transition: 0.3s;
  }
  .cart-icon:hover { background: rgba(255,255,255,0.15); }

  .cart-badge {
    position: absolute;
    top: -6px;
    right: -6px;
    background: #ff3366;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    min-width: 20px;
    height: 20px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
  }

  .hero { padding: 40px 20px 10px; text-align: center; }
  .hero h1 {
    font-size: 28px;
    margin-bottom: 8px;
    background: linear-gradient(135deg,#fff,#8a2be2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { color: #999; font-size: 14px; }

  .kategori-bar {
    display: flex;
    gap: 8px;
    padding: 20px 20px 0;
    overflow-x: auto;
    justify-content: center;
    scrollbar-width: none;
  }
  .kategori-bar::-webkit-scrollbar { display: none; }

  .kategori-btn {
    padding: 8px 18px;
    border-radius: 20px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #ccc;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: 0.2s;
  }
  .kategori-btn.active {
    background: linear-gradient(135deg,#6a5acd,#8a2be2);
    color: #fff;
    border-color: transparent;
  }

  .katalog {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
    padding: 20px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .produk {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    overflow: hidden;
    transition: 0.3s;
    display: flex;
    flex-direction: column;
  }
  .produk:hover {
    transform: translateY(-5px);
    border-color: rgba(138,43,226,0.5);
    box-shadow: 0 10px 30px rgba(138,43,226,0.2);
  }

  .produk-img {
    width: 100%;
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 56px;
    background: linear-gradient(135deg,#1a1a2e,#2a1a3e);
  }

  .produk-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
  .produk-nama { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .produk-harga { font-size: 15px; font-weight: 700; color: #00d4ff; margin-bottom: 10px; }
  .produk-harga.tanya { color: #ffaa00; font-size: 13px; }

  .btn-tambah {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg,#6a5acd,#8a2be2);
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    transition: 0.2s;
    margin-top: auto;
  }
  .btn-tambah:hover { transform: scale(1.03); box-shadow: 0 5px 15px rgba(138,43,226,0.4); }
  .btn-tambah:active { transform: scale(0.97); }

  .btn-tanya { background: linear-gradient(135deg,#00b894,#00d4ff); }
  .btn-tanya:hover { box-shadow: 0 5px 15px rgba(0,212,255,0.4); }

  .cart-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 100%;
    max-width: 400px;
    height: 100vh;
    background: #12121f;
    border-left: 1px solid rgba(255,255,255,0.1);
    z-index: 1001;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  }
  .cart-panel.show { transform: translateX(0); }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .cart-header h2 { font-size: 18px; }
  .cart-close {
    background: rgba(255,255,255,0.08);
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
  }
  .cart-close:hover { background: rgba(255,255,255,0.15); }

  .cart-items { flex: 1; overflow-y: auto; padding: 16px; }

  .cart-empty {
    text-align: center;
    color: #666;
    padding: 60px 20px;
    font-size: 14px;
  }

  .cart-item {
    display: flex;
    gap: 12px;
    padding: 12px;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    margin-bottom: 10px;
    align-items: center;
  }
  .cart-item-img {
    width: 50px;
    height: 50px;
    border-radius: 10px;
    background: linear-gradient(135deg,#1a1a2e,#2a1a3e);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-nama { font-size: 13px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-harga { font-size: 12px; color: #00d4ff; }

  .qty-control {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.3);
    border-radius: 8px;
    padding: 3px;
  }
  .qty-btn {
    width: 24px;
    height: 24px;
    border: none;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 700;
  }
  .qty-btn:hover { background: rgba(255,255,255,0.2); }
  .qty-num { font-size: 13px; min-width: 18px; text-align: center; font-weight: 600; }

  .cart-footer {
    padding: 20px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  .cart-total {
    display: flex;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 16px;
    font-weight: 700;
  }
  .cart-total span:last-child { color: #00d4ff; }

  .btn-checkout {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#00d4ff,#8a2be2);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-checkout:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(138,43,226,0.4); }
  .btn-checkout:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transition: 0.3s;
  }
  .overlay.show { opacity: 1; visibility: visible; }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(135deg,#6a5acd,#8a2be2);
    color: #fff;
    padding: 12px 24px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    z-index: 2000;
    transition: 0.3s;
    box-shadow: 0 10px 30px rgba(138,43,226,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Watermark footer */
  .watermark {
    text-align: center;
    padding: 20px;
    color: #555;
    font-size: 11px;
    letter-spacing: 1px;
    border-top: 1px solid rgba(255,255,255,0.05);
    margin-top: 20px;
  }
  .watermark span {
    background: linear-gradient(135deg,#8a2be2,#00d4ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: 700;
  }

  @media (max-width: 480px) {
    .hero h1 { font-size: 22px; }
    .katalog { grid-template-columns: repeat(2, 1fr); padding: 16px; gap: 12px; }
    .cart-panel { max-width: 100%; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
    ZANE STORE ID
  </div>
  <div class="header-right">
    <div class="cart-icon" onclick="openCart()">
      🛒
      <span class="cart-badge" id="cartBadge">0</span>
    </div>
  </div>
</header>

<section class="hero">
  <h1>AM Premium • Suntik Sosmed • Nokos</h1>
  <p>Pilih layanan → masukkan keranjang → checkout via WhatsApp 🚀</p>
</section>

<div class="kategori-bar" id="kategoriBar">
  <button class="kategori-btn active" onclick="filterKategori('semua', this)">Semua</button>
  <button class="kategori-btn" onclick="filterKategori('am', this)">AM Premium</button>
  <button class="kategori-btn" onclick="filterKategori('suntik', this)">Suntik Sosmed</button>
  <button class="kategori-btn" onclick="filterKategori('nokos', this)">Nokos</button>
</div>

<div class="katalog" id="katalog"></div>

<!-- Watermark Footer -->
<div class="watermark">
  © 2025 <span>ZANE STORE ID</span> — All Rights Reserved
</div>

<div class="overlay" id="overlay" onclick="closeAll()"></div>

<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h2>🛒 Keranjang</h2>
    <button class="cart-close" onclick="closeCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems">
    <div class="cart-empty">Keranjang masih kosong 😴<br><br>Yuk pilih layanan dulu!</div>
  </div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total:</span>
      <span id="cartTotal">Rp 0</span>
    </div>
    <button class="btn-checkout" id="btnCheckout" onclick="checkout()" disabled>
      Checkout via WhatsApp
    </button>
  </div>
</div>

<div class="toast" id="toast">Ditambahkan! ✅</div>

<script>
/* ===================================================
   © 2025 ZANE STORE ID — ALL RIGHTS RESERVED
   Dilarang copy/paste kode ini tanpa izin!
   Contact: wa.me/6282320336509
   =================================================== */

/* ===================================================
   PROTEKSI WEB
   =================================================== */
// Disable klik kanan
document.addEventListener('contextmenu', e => {
  e.preventDefault();
});

// Disable F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
document.addEventListener('keydown', e => {
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) ||
    (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) ||
    (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) ||
    (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
    (e.ctrlKey && (e.key === 'S' || e.key === 's'))
  ) {
    e.preventDefault();
    return false;
  }
});

// Disable drag
document.addEventListener('dragstart', e => e.preventDefault());

/* ===================================================
   NOMOR WHATSAPP TOKO
   =================================================== */
const noWA = '6282320336509';

/* ===================================================
   DATA PRODUK
   =================================================== */
const produkList = [
  { id: 1, kategori: "am", nama: "AM Premium 1 Bulan", harga: 30000, emoji: "⭐" },
  { id: 2, kategori: "am", nama: "AM Premium 1 Tahun (Email Pribadi)", harga: 20000, emoji: "👑" },
  { id: 3, kategori: "am", nama: "AM Premium 1 Tahun (Email Public)", harga: 10000, emoji: "💫" },

  { id: 4, kategori: "suntik", nama: "Suntik Followers Instagram", tanyaHarga: true, emoji: "📸" },
  { id: 5, kategori: "suntik", nama: "Suntik Likes Instagram", tanyaHarga: true, emoji: "❤️" },
  { id: 6, kategori: "suntik", nama: "Suntik Views Instagram", tanyaHarga: true, emoji: "👁️" },
  { id: 7, kategori: "suntik", nama: "Suntik Followers TikTok", tanyaHarga: true, emoji: "🎵" },
  { id: 8, kategori: "suntik", nama: "Suntik Likes TikTok", tanyaHarga: true, emoji: "💗" },
  { id: 9, kategori: "suntik", nama: "Suntik Views TikTok", tanyaHarga: true, emoji: "🎬" },
  { id: 10, kategori: "suntik", nama: "Suntik Subscribers YouTube", tanyaHarga: true, emoji: "▶️" },
  { id: 11, kategori: "suntik", nama: "Suntik Views YouTube", tanyaHarga: true, emoji: "📺" },
  { id: 12, kategori: "suntik", nama: "Suntik Likes YouTube", tanyaHarga: true, emoji: "👍" },

  { id: 13, kategori: "nokos", nama: "Nokos Indonesia", harga: 8000, emoji: "🇮🇩" },
  { id: 14, kategori: "nokos", nama: "Nokos Malaysia", harga: 20000, emoji: "🇲🇾" },
  { id: 15, kategori: "nokos", nama: "Nokos USA", harga: 25000, emoji: "🇺🇸" },
  { id: 16, kategori: "nokos", nama: "Nokos Algeria", harga: 10000, emoji: "🇩🇿" },
];

/* ===================================================
   RENDER PRODUK
   =================================================== */
const katalog = document.getElementById('katalog');

function renderProduk(filter = 'semua') {
  katalog.innerHTML = '';
  const data = filter === 'semua' ? produkList : produkList.filter(p => p.kategori === filter);

  if (data.length === 0) {
    katalog.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#666;">Belum ada produk di kategori ini.</p>';
    return;
  }

  data.forEach(p => {
    const el = document.createElement('div');
    el.className = 'produk';

    let hargaHTML, btnHTML;
    if (p.tanyaHarga) {
      hargaHTML = `<div class="produk-harga tanya">💬 Tanya Harga</div>`;
      btnHTML = `<button class="btn-tambah btn-tanya" onclick="tanyaHarga(${p.id})">Tanya Harga</button>`;
    } else {
      hargaHTML = `<div class="produk-harga">Rp ${p.harga.toLocaleString('id-ID')}</div>`;
      btnHTML = `<button class="btn-tambah" onclick="addToCart(${p.id})">+ Keranjang</button>`;
    }

    el.innerHTML = `
      <div class="produk-img">${p.emoji}</div>
      <div class="produk-info">
        <div class="produk-nama">${p.nama}</div>
        ${hargaHTML}
        ${btnHTML}
      </div>
    `;
    katalog.appendChild(el);
  });
}

function filterKategori(kat, btn) {
  document.querySelectorAll('.kategori-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProduk(kat);
}

/* ===================================================
   TANYA HARGA
   =================================================== */
function tanyaHarga(id) {
  const p = produkList.find(x => x.id === id);
  const pesan = `Halo ZANE STORE ID, saya mau tanya harga untuk layanan *${p.nama}*. Mohon info harga & detailnya ya 🙏`;
  window.open(`https://wa.me/${noWA}?text=${encodeURIComponent(pesan)}`, '_blank');
}

/* ===================================================
   CART LOGIC
   =================================================== */
let cart = [];

function addToCart(id) {
  const produk = produkList.find(p => p.id === id);
  const existing = cart.find(c => c.id === id);
  if (existing) existing.qty++;
  else cart.push({ ...produk, qty: 1 });
  renderCart();
  showToast(`${produk.nama} ditambahkan ✅`);
}

function changeQty(id, delta) {
  const item = cart.find(c => c.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(c => c.id !== id);
  renderCart();
}

function renderCart() {
  const itemsEl = document.getElementById('cartItems');
  const badge = document.getElementById('cartBadge');
  const totalEl = document.getElementById('cartTotal');
  const btn = document.getElementById('btnCheckout');

  const totalQty = cart.reduce((s, i) => s + i.qty, 0);
  badge.textContent = totalQty;
  badge.style.display = totalQty > 0 ? 'flex' : 'none';

  if (cart.length === 0) {
    itemsEl.innerHTML = '<div class="cart-empty">Keranjang masih kosong 😴<br><br>Yuk pilih layanan dulu!</div>';
    totalEl.textContent = 'Rp 0';
    btn.disabled = true;
    return;
  }

  itemsEl.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="cart-item-img">${item.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-nama">${item.nama}</div>
        <div class="cart-item-harga">Rp ${(item.harga * item.qty).toLocaleString('id-ID')}</div>
      </div>
      <div class="qty-control">
        <button class="qty-btn" onclick="changeQty(${item.id},-1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id},1)">+</button>
      </div>
    </div>
  `).join('');

  const total = cart.reduce((s, i) => s + i.harga * i.qty, 0);
  totalEl.textContent = 'Rp ' + total.toLocaleString('id-ID');
  btn.disabled = false;
}

/* ===================================================
   CHECKOUT VIA WHATSAPP
   =================================================== */
function checkout() {
  if (cart.length === 0) return;

  let pesan = 'Halo ZANE STORE ID, saya mau order:%0A%0A';
  cart.forEach(i => {
    pesan += `• ${i.nama} x${i.qty} = Rp ${(i.harga * i.qty).toLocaleString('id-ID')}%0A`;
  });
  const total = cart.reduce((s, i) => s + i.harga * i.qty, 0);
  pesan += `%0A*Total: Rp ${total.toLocaleString('id-ID')}*%0A%0AMohon diproses ya 🙏`;

  window.open(`https://wa.me/${noWA}?text=${pesan}`, '_blank');
}

/* ===================================================
   UI CONTROL
   =================================================== */
const overlay = document.getElementById('overlay');
const cartPanel = document.getElementById('cartPanel');

function openCart() {
  cartPanel.classList.add('show');
  overlay.classList.add('show');
}

function closeCart() {
  cartPanel.classList.remove('show');
  overlay.classList.remove('show');
}

function closeAll() {
  cartPanel.classList.remove('show');
  overlay.classList.remove('show');
}

/* ===================================================
   TOAST
   =================================================== */
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
}

/* ===================================================
   INIT
   =================================================== */
renderProduk();
renderCart();
</script>

</body>
</html>
